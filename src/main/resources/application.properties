spring.application.name=communication_platform
# --- Database connection ---
spring.datasource.url=jdbc:postgresql://localhost:5432/communication_platform
spring.datasource.username=maalfa_user
spring.datasource.password=maalfa_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
app.jwt.secret=CHANGE_ME_to_a_long_random_base64_string_at_least_32_bytes
app.jwt.access-token-expiration-ms=900000
# --- Server (optional, adjust as you like) ---
server.address=0.0.0.0
server.port=8077